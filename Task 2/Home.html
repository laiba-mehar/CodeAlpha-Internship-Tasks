<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - CodeAlpha Task 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-container">
    <div class="calculator">
      <!-- Display Screen -->
      <div class="display">
        <div class="previous-operand" id="previousOperand"></div>
        <div class="current-operand" id="currentOperand">0</div>
      </div>

      <!-- Keypad Buttons -->
      <div class="buttons-grid">
        <button class="btn action-btn" id="clearBtn">AC</button>
        <button class="btn action-btn" id="deleteBtn">DEL</button>
        <button class="btn operator-btn" data-operator="÷">÷</button>

        <button class="btn number-btn">7</button>
        <button class="btn number-btn">8</button>
        <button class="btn number-btn">9</button>
        <button class="btn operator-btn" data-operator="×">×</button>

        <button class="btn number-btn">4</button>
        <button class="btn number-btn">5</button>
        <button class="btn number-btn">6</button>
        <button class="btn operator-btn" data-operator="-">−</button>

        <button class="btn number-btn">1</button>
        <button class="btn number-btn">2</button>
        <button class="btn number-btn">3</button>
        <button class="btn operator-btn" data-operator="+">+</button>

        <button class="btn number-btn zero-btn">0</button>
        <button class="btn number-btn">.</button>
        <button class="btn equals-btn" id="equalsBtn">=</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
